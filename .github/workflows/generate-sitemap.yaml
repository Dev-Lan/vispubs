name: Generate Sitemap

on:
  push:
    branches: [main]
    paths: ['public/data/papers.csv']
  # A push-triggered workflow only ever runs the copy of itself that exists on
  # the default branch, so without this there is no way to run it on demand or
  # to test a change to it before merging.
  workflow_dispatch:

# git-auto-commit-action pushes the regenerated sitemap back to main, which the
# default read-only GITHUB_TOKEN rejects with a 403.
permissions:
  contents: write

jobs:
  generate-sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate sitemap
        run: python src/dataProcess/generate_sitemap.py

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: regenerate sitemap.xml'
          file_pattern: public/sitemap.xml
